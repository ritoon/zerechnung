name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (Go ${{ matrix.go }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The oldest version allowed by go.mod, and the latest release.
        go: ['1.24.x', 'stable']
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go }}
      - name: gofmt
        run: |
          files=$(gofmt -l $(git ls-files '*.go'))
          if [ -n "$files" ]; then
            echo "Files not formatted with gofmt:"
            echo "$files"
            exit 1
          fi
      - name: go vet
        run: go vet ./...
      - name: go test -race
        # -coverpkg counts the code of every package reached by the tests,
        # such as the rule sets exercised through package validate.
        run: go test -race -coverpkg=./... -coverprofile=coverage.out ./...
      - name: Allocation budgets
        # The race detector allocates: the tests of testing.AllocsPerRun
        # skip under -race, and run here without it.
        run: go test -count=1 -run 'Allocs' ./...
      - name: Build the command
        run: go build ./cmd/zerechnung
      - name: Upload the coverage to Codecov
        if: matrix.go == 'stable'
        uses: codecov/codecov-action@v7
        with:
          files: coverage.out
          disable_search: true
          token: ${{ secrets.CODECOV_TOKEN }}

  server:
    # The HTTP server (server/), a module of its own that ./... does not
    # reach: it imports nothing outside the standard library either, but
    # calls the network (JWKS, log outputs). The images are built by the
    # Docker workflow.
    name: Server (Go ${{ matrix.go }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go: ['1.24.x', 'stable']
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go }}
      - name: go vet
        run: go vet ./...
      - name: go test -race
        run: go test -race ./...
      - name: Cross-compile for Windows, macOS and Linux
        run: |
          for t in windows/amd64 windows/arm64 darwin/amd64 darwin/arm64 linux/arm64 linux/arm; do
            GOOS=${t%/*} GOARCH=${t#*/} CGO_ENABLED=0 go build -o /dev/null ./cmd/zerechnung-server
          done

  server-lint:
    name: Server lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: stable
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0
          working-directory: server
          args: --config=../.golangci.yml

  lint:
    # Settings in .golangci.yml: staticcheck, errcheck, doc comments of the
    # exported symbols (revive) and their final period (godot).
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: stable
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0

  nl:
    # The tests of the Dutch rules on the official artefacts, which the test
    # job skips: the catalogs against the NPa schematrons (FX_NL) and the
    # SimplerInvoicing test files (FX_NL_TESTS). fetch-nl.sh needs git only
    # and takes a few seconds; the Conformité workflow runs them too, with
    # every other artefact.
    name: Tests NLCIUS sur les artefacts officiels
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: stable
      - name: Fetch the NPa artefacts and the SimplerInvoicing test files
        run: conformance/fetch-nl.sh >/dev/null
      - name: go test with FX_NL and FX_NL_TESTS
        run: |
          set -o pipefail
          go test -count=1 -v -run '^(TestSchematron|TestTestFiles|TestNLTestFiles)$' ./internal/rules/nl ./validate | tee test.log
          for t in TestSchematron TestTestFiles TestNLTestFiles; do
            if ! grep -q -- "--- PASS: $t " test.log; then
              echo "::error::$t did not run"
              exit 1
            fi
          done
