name: Site

# Builds the presentation site from site/ and publishes it on GitHub Pages.
# Pull requests only build and test it; pushes to main also deploy it. The
# repository settings must use "GitHub Actions" as the source of Pages.
#
# The examples of the site are programs that call the package: a change to
# its Go code runs the workflow too, so that an API change cannot break them
# unnoticed.

on:
  push:
    branches: [main]
    paths: ['site/**', '**.go', 'go.mod', '.github/workflows/site.yml']
  pull_request:
    paths: ['site/**', '**.go', 'go.mod', '.github/workflows/site.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build the site
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: stable
          # The site module depends only on the package of this repository,
          # which has no dependency: there is no go.sum to key a cache on.
          cache: false
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test ./...
      - name: Generate the pages
        run: go run . -out public
      - uses: actions/upload-pages-artifact@v5
        if: github.event_name != 'pull_request'
        with:
          path: site/public

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
