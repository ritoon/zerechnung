name: Conformité

# Tests on the official artefacts, and parity with the reference validators.
# See conformance/README.md.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: conformance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  artifacts:
    # The tests that need the official artefacts (FX_* variables), which are
    # skipped by the CI workflow.
    name: Tests sur les artefacts officiels
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: stable
      - name: Install pdfdetach (poppler-utils) and xmllint (libxml2-utils)
        run: sudo apt-get update -q && sudo apt-get install -y -q poppler-utils libxml2-utils
      - uses: actions/cache@v5
        with:
          path: conformance/.artifacts
          key: artifacts-${{ hashFiles('conformance/fetch.sh', 'conformance/fetch-nl.sh', 'conformance/lib.sh') }}
      - name: Fetch the artefacts at pinned versions
        run: conformance/fetch.sh >/dev/null
      - name: go test with every artefact
        run: |
          set -o pipefail
          # Built with the tag ruletrace, each test binary appends the rules
          # it raises to rules.txt, for TestRuleCoverage.
          ZERECHNUNG_RULE_TRACE=$PWD/rules.txt go test -tags ruletrace -count=1 -v ./... 2>&1 | tee test.log | grep -E '^(ok|FAIL|--- FAIL|--- SKIP|panic)' || true
          grep -q -E '^(FAIL|panic)' test.log && exit 1
          if grep -q -- '--- SKIP' test.log; then
            echo "::error::tests skipped although every artefact is available"
            exit 1
          fi
      - name: Rules raised by the test suite
        # Each rule of the catalogs is raised by a test, unless
        # testdata/rule-coverage.txt lists it.
        run: go test -count=1 -v -run '^TestRuleCoverage$' . -rule-coverage rules.txt
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: go-test-artifacts
          path: |
            test.log
            rules.txt
          retention-days: 30

  verapdf:
    # The files that ConvertPDFA writes, checked by veraPDF 1.30.3 (Docker
    # image pinned by digest): the PDF/A-2b and PDF/A-3b files of the veraPDF
    # corpus, converted, and the non-conforming PDF files that the tests
    # generate and convert. Every converted file passes, but the known
    # failures of convert_corpus_test.go.
    name: veraPDF sur les PDF convertis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: stable
      - uses: actions/cache@v5
        with:
          path: conformance/.artifacts/verapdf-corpus
          key: verapdf-${{ hashFiles('conformance/verapdf.sh', 'conformance/lib.sh') }}
      - name: Convert the files and check them with veraPDF
        run: conformance/verapdf.sh
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: verapdf-report
          path: |
            conformance/.artifacts/pdfa/report.txt
            conformance/.artifacts/pdfa/verapdf.log
          retention-days: 30

  parity:
    # Rules raised by this package and by the KoSIT validator 1.6.3
    # (XRechnung 3.0.2 configuration of 2026-08-31) and Mustang 2.26.0; for
    # NLCIUS, by the XSLT of the NPa schematrons run by Saxon-HE 12.10; for
    # the CIUS-PT, by the schematron of eSPap compiled by SchXslt 1.10.1 and
    # run by Saxon-HE 12.10, on the same elements; invoice by invoice. Java
    # runs in the CI only: the package is pure Go.
    name: Parité avec KoSIT, Mustang, la NPa et eSPap
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: stable
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Install pdfdetach (poppler-utils)
        run: sudo apt-get update -q && sudo apt-get install -y -q poppler-utils
      - uses: actions/cache@v5
        with:
          path: conformance/.artifacts
          key: parity-${{ hashFiles('conformance/fetch.sh', 'conformance/fetch-nl.sh', 'conformance/lib.sh', 'conformance/parity.sh') }}
      - name: Test the comparison tool
        run: cd conformance/parity && go vet ./... && go test ./...
      - name: Compare with KoSIT, Mustang, the NPa XSLT and the CIUS-PT schematron
        run: conformance/parity.sh
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: parity-reports
          path: |
            conformance/.artifacts/parity/report.md
            conformance/.artifacts/parity/report.json
            conformance/.artifacts/parity/index.tsv
            conformance/.artifacts/parity/*.log
            conformance/.artifacts/parity/kosit/
            conformance/.artifacts/parity/mustang/
            conformance/.artifacts/parity/npa/
            conformance/.artifacts/parity/pt/
            conformance/.artifacts/parity/cius-pt.xsl
            conformance/.artifacts/parity/pt-variants/manifest.tsv
          retention-days: 30

  signature:
    # The CAdES and XAdES signatures of package fatturapa against OpenSSL
    # 3.0, xmlsec1 1.2 and EU DSS 6.5.1, and the PAdES signatures of package
    # zerechnung against pdfsig (Poppler) and EU DSS, both ways: each tool
    # verifies the files the packages sign, and the packages verify the
    # files the tools sign. Java, xmlsec1 and pdfsig run in the CI only: the
    # packages are pure Go.
    name: Interopérabilité des signatures FatturaPA et PAdES
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: stable
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: conformance/signature/pom.xml
      - name: Install xmlsec1 and pdfsig
        run: sudo apt-get update -q && sudo apt-get install -y -q xmlsec1 poppler-utils
      - name: Sign and verify with OpenSSL, xmlsec1, pdfsig and DSS
        run: conformance/signature.sh
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: signature-interop
          path: |
            conformance/.artifacts/signature/
            !conformance/.artifacts/signature/keys/
          retention-days: 30

  qr:
    # The QR codes of internal/qr read by gozxing (a port of ZXing) and by the
    # decoder of piglig/go-qr, in a separate module (conformance/qr) so that
    # neither enters go.mod.
    name: Lecture des QR codes par deux décodeurs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: stable
      - name: Read the symbols with gozxing and piglig/go-qr
        run: cd conformance/qr && go vet ./... && go test -count=1 -v ./...
